<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #ffffff; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script type="module">
    import { PptxViewer } from '/src/index.ts';
    import { threeD } from '@ooxml-test-three-d-renderer';
    import { regionMap } from '@ooxml-test-region-map-renderer';
    import { tiff } from '@ooxml-test-tiff-renderer';
    import { chartEx } from '@ooxml-test-chart-ex-renderer';

    const fixtureFontStylesheets = [
      '/node_modules/@fontsource/nunito-sans/400.css',
      '/node_modules/@fontsource/nunito-sans/400-italic.css',
      '/node_modules/@fontsource/nunito-sans/700.css',
      '/node_modules/@fontsource/nunito-sans/700-italic.css',
      '/node_modules/@fontsource/nunito-sans/300.css',
      '/node_modules/@fontsource/nunito-sans/600.css',
    ];
    const fontFamily = (family) => family.trim().replace(/^['"]|['"]$/g, '').toLowerCase();
    const params   = new URLSearchParams(location.search);
    const slideIdx = Math.max(0, parseInt(params.get('slide') ?? '0', 10));
    const pptxName = params.get('pptx') ?? 'sample';
    // Optional render width override (CSS px), e.g. ?width=960 — used by the
    // scale-parameterised specs; the default matches the reference images.
    const width    = Math.max(1, parseInt(params.get('width') ?? '1280', 10));

    const canvas = document.getElementById('canvas');
    const viewer = new PptxViewer(canvas, {
      width,
      threeD,
      regionMap,
      tiff,
      chartEx,
      onError: (err) => {
        document.body.dataset.status = 'error';
        document.body.dataset.errorMessage = err.message;
        console.error('[fixture] error:', err);
      },
    });
    let destroyed = false;
    const destroy = () => {
      if (destroyed) return;
      destroyed = true;
      viewer.destroy();
    };
    window.destroyPptxVrt = destroy;
    window.addEventListener('pagehide', destroy, { once: true });

    try {
      // Fontsource partitions each weight/style into unicode-range faces.
      // Loading a font shorthand only fetches the subset matching its sample
      // text, so wait for the CSS and load every declared face directly.
      const sheets = await Promise.all(fixtureFontStylesheets.map((href) => new Promise((resolve, reject) => {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = href;
        link.onload = () => link.sheet
          ? resolve(link.sheet)
          : reject(new Error(`fixture font stylesheet unavailable: ${href}`));
        link.onerror = () => reject(new Error(`fixture font stylesheet failed: ${href}`));
        document.head.append(link);
      })));
      const declaredCount = sheets.reduce((count, sheet) => count + [...sheet.cssRules].filter(
        (rule) => rule instanceof CSSFontFaceRule && fontFamily(rule.style.fontFamily) === 'nunito sans',
      ).length, 0);
      const faces = [...document.fonts].filter((face) => fontFamily(face.family) === 'nunito sans');
      if (declaredCount === 0 || faces.length !== declaredCount) {
        throw new Error(`fixture Nunito Sans faces: declared ${declaredCount}, registered ${faces.length}`);
      }
      await Promise.all(faces.map((face) => face.load()));
      await document.fonts.ready;
      const resp = await fetch(`/${pptxName}.pptx`);
      if (!resp.ok) throw new Error(`fetch failed: ${resp.status}`);
      const buf = await resp.arrayBuffer();
      await viewer.load(buf);
      document.body.dataset.slideCount = String(viewer.slideCount);
      if (slideIdx !== 0) {
        await viewer.goToSlide(slideIdx);
      }
      window.renderPptxVrtSlide = async (slideIndex) => {
        await viewer.goToSlide(slideIndex);
      };
      document.body.dataset.status = 'ready';
    } catch (err) {
      document.body.dataset.status = 'error';
      document.body.dataset.errorMessage = String(err);
      console.error('[fixture] fatal:', err);
    }
  </script>
</body>
</html>
