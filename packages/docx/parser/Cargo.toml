[package]
name = "docx-parser"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
zip = { workspace = true }
roxmltree = { workspace = true }
quick-xml = { workspace = true }
console_error_panic_hook = { workspace = true }
ooxml-common = { workspace = true }
docx-model = { workspace = true }

[dev-dependencies]
# Test-only GFM parser used to prove projected document text forms no Markdown
# structure; never linked into the WASM build.
ooxml-common = { workspace = true, features = ["gfm-check"] }

# `-Oz` optimizes the wasm binary for size (over the default `-O`), shrinking
# the artifact browsers download. wasm-pack runs this pass after wasm-bindgen.
[package.metadata.wasm-pack.profile.release]
# Repeat the same size pass until it stops shrinking; keep LLVM opt-level="s"
# to avoid the parse-time cost of compiling all Rust code with opt-level="z".
wasm-opt = ["-Oz", "--converge"]

[package.metadata.wasm-pack.profile.release.wasm-bindgen]
omit-default-module-path = true
