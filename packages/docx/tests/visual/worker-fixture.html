<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>* { margin: 0; padding: 0; } canvas { display: block; }</style>
</head>
<body>
  <canvas id="main-canvas"></canvas>
  <canvas id="worker-canvas"></canvas>
  <script type="module">
    import { DocxDocument } from '/src/index.ts';
    import { math } from '@ooxml-test-math-renderer';
    import { threeD } from '@ooxml-test-three-d-renderer';
    import { regionMap } from '@ooxml-test-region-map-renderer';
    import { chartEx } from '@ooxml-test-chart-ex-renderer';

    const params = new URLSearchParams(location.search);
    const name = params.get('docx') ?? 'demo/sample-1';
    const page = Math.max(0, parseInt(params.get('page') ?? '0', 10));
    const width = 1280;
    const dpr = 1;

    try {
      const resp = await fetch(`/${name}.docx`);
      if (!resp.ok) throw new Error(`fetch ${name}.docx -> ${resp.status}`);
      const buf = await resp.arrayBuffer();

      const paint = (id, bmp) => {
        const c = document.getElementById(id);
        c.width = bmp.width;
        c.height = bmp.height;
        c.getContext('2d').drawImage(bmp, 0, 0);
        bmp.close();
      };

      const renderers = { math, threeD, regionMap, chartEx };
      const main = await DocxDocument.load(buf.slice(0), { useGoogleFonts: true, ...renderers });
      paint('main-canvas', await main.renderPageToBitmap(page, { width, dpr }));
      main.destroy();

      const wk = await DocxDocument.load(buf.slice(0), { mode: 'worker', useGoogleFonts: true, ...renderers });
      paint('worker-canvas', await wk.renderPageToBitmap(page, { width, dpr }));
      wk.destroy();

      document.body.dataset.status = 'ready';
    } catch (err) {
      document.body.dataset.status = 'error';
      document.body.dataset.errorMessage = err.message;
      console.error('[worker-fixture] error:', err);
    }
  </script>
</body>
</html>
